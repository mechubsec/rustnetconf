# cargo-deny configuration.
#
# CI runs `cargo deny check bans sources licenses` (.github/workflows/security.yml).
# Advisories are covered separately by `cargo audit` in the same workflow.
#
# Accepted prerelease (issue #64)
# -------------------------------
# russh exact-pins `ssh-key =0.7.0-rc.11`. That is still the newest ssh-key
# on crates.io (max stable is 0.6.7). argon2 0.6.0 and blake2 0.11.0 are
# already stable; they arrive through ssh-key and are not prerelease.
# cargo-deny has no "deny prereleases except X" check, so CI also runs
# `.github/scripts/check-lockfile-prereleases.py` in security.yml. That
# allowlists ssh-key 0.7.0-rc.* and fails if any other Cargo prerelease
# appears in a committed Cargo.lock.
#
# Exit condition: ssh-key 0.7.0 stable **and** a russh release that depends
# on it (russh 0.63.x and 0.64.x still exact-pin the RC). Then delete this
# note, remove the allowlist in the guard, and close #64. Do not watch
# russh releases for this; a russh bump does not drop the pin.

[graph]
all-features = true

[licenses]
# Permissive licenses only. Every entry below is present in the current
# dependency tree — this is an inventory, not an aspirational list. Adding a
# license here is a deliberate act: check the obligations it imposes first.
#
# Deliberately absent: LGPL-2.1-or-later. It appears in the tree via r-efi,
# which is `MIT OR Apache-2.0 OR LGPL-2.1-or-later`, so the MIT arm satisfies
# it and no copyleft obligation attaches. If a crate ever arrives that offers
# LGPL *only*, this check should fail and prompt a decision rather than
# silently accept it.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    # Mozilla's CA root bundle (webpki-roots), reached via the `tls` feature.
    # A permissive *data* license — no copyleft, no source obligation.
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# Refuse to guess when a license file is ambiguous — an unclear license should
# fail the check, not be approximated.
confidence-threshold = 0.93

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
